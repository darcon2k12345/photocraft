[package]
name = "craft-update"
description = "Release checking, downloading, installing and self-updating for the Craft App Suite (vendored copy: also recognises the Patronus publisher, see VENDORED.md)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"
publish = false
autotests = false

[features]
suite = ["screen-testing", "craft-ui/suite"]
oci_migration = []
default = []
ui = ["dep:egui", "dep:image", "dep:craft-ui", "dep:craft-host", "dep:craft-theme"]
screen-testing = ["ui", "craft-ui/testing"]

[dependencies]
egui = { version = "0.37", default-features = false, optional = true }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "683fe06031224725b913c8ad3697d8e8bfec6c90", optional = true }
craft-theme = { git = "https://github.com/storytold/craft-libs", rev = "683fe06031224725b913c8ad3697d8e8bfec6c90", optional = true }
craft-host = { git = "https://github.com/storytold/craft-libs", rev = "683fe06031224725b913c8ad3697d8e8bfec6c90", features = ["ui"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tempfile = "3"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
semver = { version = "1", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
dunce = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
winsafe = { version = "0.0.29", features = ["advapi", "kernel", "shell", "version"] }
verifysign = "1"
